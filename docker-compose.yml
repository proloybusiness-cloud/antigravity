services:
  omnios:
    build: .
    container_name: omnios
    restart: unless-stopped
    ports:
      - "${PORT:-3777}:3777"
    environment:
      - PORT=3777
      - HOST=0.0.0.0
      - OMNIOS_DATA_DIR=/app/data
      - OMNIOS_LITE=${OMNIOS_LITE:-0}
    volumes:
      - ./data:/app/data
    mem_limit: 512m
