name: Build & Publish OmniOS Live ISO

on:
  push:
    tags:
      - 'omnios-*-live-iso'
      - 'omnios-*-pro-iso'
      - 'omnios-*-lite-iso'
  workflow_dispatch:
    inputs:
      edition:
        description: 'ISO edition to build (pro or lite)'
        required: true
        default: 'pro'
        type: choice
        options:
          - pro
          - lite
      release_tag:
        description: 'Release tag name (e.g., omnios-v2.1-pro-iso)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-live-iso:
    name: Build Hybrid BIOS+UEFI Live ISO (x86_64)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free runner disk space for Pro ISO build
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL 2>/dev/null || true
          df -h

      - name: Determine ISO edition and artifact filename
        id: meta
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            EDITION="${{ inputs.edition }}"
          elif [[ "${GITHUB_REF_NAME}" == *-lite-iso ]] || [[ "${GITHUB_REF_NAME}" == omnios-v2.0.0-live-iso ]]; then
            EDITION="lite"
          else
            EDITION="pro"
          fi

          if [ "${EDITION}" = "lite" ]; then
            ISO_FILE="omnios-live-x86_64.iso"
          else
            ISO_FILE="omnios-v2-pro-x86_64.iso"
          fi

          echo "edition=${EDITION}" >> "$GITHUB_OUTPUT"
          echo "iso_file=${ISO_FILE}" >> "$GITHUB_OUTPUT"

      - name: Build OmniOS Live ISO (${{ steps.meta.outputs.edition }})
        run: ./scripts/build-iso.sh --edition "${{ steps.meta.outputs.edition }}"

      - name: Verify ISO artifacts & SHA-256
        run: |
          ISO_FILE="${{ steps.meta.outputs.iso_file }}"
          ls -lh "dist/${ISO_FILE}" "dist/${ISO_FILE}.sha256"
          SIZE_BYTES=$(stat -c%s "dist/${ISO_FILE}")
          echo "ISO size: ${SIZE_BYTES} bytes"
          if [ "${SIZE_BYTES}" -ge 2147483648 ]; then
            echo "::error::ISO size (${SIZE_BYTES} bytes) meets or exceeds GitHub Releases 2.0 GiB asset limit (2147483648 bytes)."
            exit 1
          fi
          (cd dist && sha256sum -c "${ISO_FILE}.sha256")

      - name: Publish GitHub Release with Live ISO
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          EDITION="${{ steps.meta.outputs.edition }}"
          ISO_FILE="${{ steps.meta.outputs.iso_file }}"

          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME}"
          elif [ -n "${{ inputs.release_tag }}" ]; then
            TAG="${{ inputs.release_tag }}"
          else
            TAG="omnios-${EDITION}-$(date -u +%Y%m%d-%H%M)-iso"
          fi

          SHA="$(awk '{print $1}' "dist/${ISO_FILE}.sha256")"
          SIZE_MB="$(du -m "dist/${ISO_FILE}" | awk '{print $1}')"

          if [ "${EDITION}" = "pro" ]; then
            TITLE="OmniOS 2.1 NextGen Pro Live ISO (${TAG})"
            cat > /tmp/release-notes.md <<EOF
          ## OmniOS 2.1 NextGen Pro — Daily-Driver Live ISO (\`x86_64\` Hybrid BIOS + UEFI)

          A full-featured, next-generation daily-driver OS inspired by **macOS 29 Liquid Glass**, **Windows 12 Fluent Acrylic**, and **Remix OS**, powered by **KDE Plasma 6.6 Wayland** + **KWin Blur/Animations** + **OmniOS Multi-Platform Runtime** — ready to boot cleanly across **Oracle VirtualBox** (VMSVGA / VBoxSVGA / VBoxVGA), **VMware Workstation**, **QEMU/KVM**, and bare-metal USB.

          ### Downloads
          - **\`${ISO_FILE}\`** (~${SIZE_MB} MB) — Hybrid El-Torito BIOS + UEFI bootable live image
          - **\`${ISO_FILE}.sha256\`** — SHA-256: \`${SHA}\`

          Verify integrity after download:
          \`\`\`bash
          # Linux
          sha256sum -c ${ISO_FILE}.sha256
          # macOS
          shasum -a 256 -c ${ISO_FILE}.sha256
          \`\`\`
          \`\`\`powershell
          # Windows PowerShell
          (Get-FileHash ${ISO_FILE} -Algorithm SHA256).Hash -eq "${SHA^^}"
          \`\`\`

          ### What's New in v2.1 Pro
          - **Zero Boot-Loop Multi-Hypervisor Graphics**: SDDM now runs natively on **Wayland** (\`kwin_wayland\`), removes crashing \`xf86-video-vmware\` Xorg DDX, adds BIOS + UEFI GRUB \`gfxterm\`/\`gfxpayload\` + \`simpledrm\` AMS support, and automatically configures safe Mesa software GL & software cursor across VirtualBox VMSVGA (3D OFF & 3D ON), VBoxSVGA, VBoxVGA, QEMU, and non-3D GPUs.
          - **Pre-Installed VirtualBox Guest Additions (\`7.0.22\`)**: Out-of-the-box dynamic display resize (\`VBoxDRMClient\` + \`vboxvideo\`), **Bidirectional Shared Clipboard** (Klipper ↔ XWayland bridge), **Host → Guest File & Folder Drag-and-Drop** directly onto the Liquid Glass Desktop (with KDE notification toast), and auto-mounted **Shared Folders** (\`/media/sf_*\`) exposed on the Desktop & Dolphin Places — cleanly hypervisor-guarded with zero impact on VMware, QEMU, or bare metal.
          - **Live Optical Disc & USB Auto-Mount**: Inserting any CD/DVD ISO (including VirtualBox Guest Additions CD) or FAT32/exFAT/NTFS/ext4 USB flash drive automatically mounts it under \`/run/media/omnios/<label>\` via \`UDisks2\` + \`Polkit\` + \`Solid\` and immediately shows it in **Dolphin**, **Plasma Device Notifier**, and right on the **Desktop** (cleanly removed on eject).
          - **Copy-to-RAM Boot Profile (\`omnios.toram=1\`)**: 5th GRUB entry loads the SquashFS into RAM (on VMs with >= 4 GB RAM) and releases \`/dev/sr0\`, letting you swap CDs or insert Guest Additions ISO even on a 1-optical-drive VM.

          ### Next-Gen Desktop & Real Customized Open-Source Themes
          - **KDE Plasma 6.6.6 Wayland + KWin Compositor**: Real Dual-Kawase frosted glass blur, Magic Lamp & Scale animations, Overview (\`Meta+W\`), Quick Tiling (\`Meta+T\`), floating translucent top menu bar, centered clock, and floating glass pill dock.
          - **3 Built-In Custom OmniOS Themes** (built by customizing open-source **MacTahoe-kde**, **Fluent-kde**, **MacTahoe-icon-theme**, **MacTahoe-gtk-theme**, and **WhiteSur-cursors** with bespoke OmniOS 2.1 Liquid Glass wallpapers & Orb branding):
            1. **OmniOS Liquid Glass Dark** *(default — macOS 29 + Windows 12 fusion)*
            2. **OmniOS Windows 12 Fluent** *(centered floating acrylic taskbar + right-side controls)*
            3. **OmniOS Silk Glass Light** *(bright pearlescent frosted glass)*
            - Switch anytime in 1 click via **OmniOS Theme Studio** on the dock or **System Settings -> Appearance**.
          - **Custom Branded SDDM Glass Login Screen** (\`OmniOS-Glass\`, auto-logs in as \`omnios\` / \`omnios\`).

          ### Pre-Installed Real Open-Source Daily-Driver Apps
          - **Web & Hub**: **Firefox 160** (pre-wired with **OmniOS Hub** Start Page & Flathub bookmarks) + **OmniOS Hub** (runs \`.apk\`, \`.exe\`, \`.ipa\`, \`.app.zip\`, \`.uapp\` on Node.js 24)
          - **Office Suite**: **LibreOffice 25.8** (**Writer**, **Calc**, **Impress** with native Plasma 6 Qt6 integration)
          - **Creative & Media**: **VLC Media Player**, **Elisa Music Player**, **GIMP 3.2 Photo Studio**, **Gwenview Photos**, **Okular PDF & Document Reader**
          - **Files & Code**: **Dolphin** (tabs, split view, Removable Devices, VirtualBox Shared Folders, SMB/SFTP, thumbnails), **Kate Code Studio**, **KWrite**, **Konsole** (blurred glass terminal with **Zsh**, custom **Fastfetch** OmniOS emblem, **btop**, **git**, **Python 3**, **Node.js 24**, \`omnios-cli\`)
          - **System & App Store**: **Discover Software Center + Flatpak (Flathub pre-configured)**, **Plasma System Monitor**, **Spectacle** (Screenshots & Screen Recorder), **KCalc**, **KClock**, **Ark**, **GParted**, **Wine 11.0** (run native Windows \`.exe\` apps)
          - **Hardware, VirtualBox & VMware**: **PipeWire** audio, **NetworkManager** (Wi-Fi + Ethernet GUI), **Bluetooth**, **VirtualBox Guest Additions** (Bidirectional Clipboard, Host→Guest Drag-and-Drop, Dynamic Resize, Shared Folders), **Open-VM-Tools + GTK**, and **UDisks2 + Polkit + FAT32/exFAT/NTFS/ISO9660/UDF** auto-mount

          ### Oracle VirtualBox Recommended Setup
          1. **Machine -> New**: Name \`OmniOS 2.1 Pro\`, ISO Image \`${ISO_FILE}\`, Type **Linux**, Version **Other Linux (64-bit)** (BIOS or EFI both supported).
          2. **Resources**: **4 GB RAM** recommended (2 GB minimum; **4 GB+ required** for the \`Copy to RAM\` GRUB profile), **2+ vCPUs**, **128 MB Video Memory**.
          3. **Display**: **VMSVGA** (default; works with 3D Acceleration OFF or ON), **VBoxSVGA**, and **VBoxVGA** are ALL supported cleanly with zero boot loop.
          4. **Clipboard, Drag-and-Drop & Shared Folders**:
             - VirtualBox Guest Additions are **already pre-installed and active automatically** — no manual installer run needed!
             - Enable host-side integration in VirtualBox: **Devices -> Shared Clipboard -> Bidirectional** and **Devices -> Drag and Drop -> Bidirectional** (or **Host to Guest**). Dragging files or folders from your host onto the OmniOS desktop copies them straight to \`~/Desktop/\` with a notification toast.
             - Auto-mount VirtualBox Shared Folders appear automatically at \`/media/sf_<name>\`, on the **Desktop**, and under **Dolphin -> VirtualBox Shared Folders** (use Shared Folders for Guest → Host file transfer).
          5. **Inserting CDs / Guest Additions ISO / USB Drives**:
             - Any inserted optical disc or USB drive auto-mounts under \`/run/media/omnios/<label>\` and appears immediately on the **Desktop**, in **Dolphin**, and in the top-bar **Device Notifier**.
             - On a single-optical-drive VM, select the 5th GRUB entry **Copy to RAM (Free Optical Drive)** (needs >= 4 GB RAM) — or attach a **2nd Optical Drive** in VM Storage settings — so \`/dev/sr0\` is free for inserting additional discs while running live.

          ### VMware Workstation Recommended Setup
          1. **File -> New Virtual Machine -> Typical -> Installer disc image file (iso)** -> select \`${ISO_FILE}\`.
          2. **Guest OS**: **Linux** -> **Other Linux 6.x kernel 64-bit** (BIOS or UEFI both supported).
          3. **Resources**: **4 GB RAM** (2 GB minimum), **2+ vCPUs**, **Enable 3D graphics acceleration** in Display settings for silky 60fps KWin glass blur (also works cleanly with 3D off via Mesa \`llvmpipe\`), **NAT** or **Bridged** network.
          4. **Power on**: Auto-logs directly into **OmniOS 2.1 NextGen Pro** (user: \`omnios\` / pass: \`omnios\`, passwordless \`sudo\`, \`Ctrl+Alt+F3\` login TTY, \`Ctrl+Alt+F4\` root shell; OmniOS Hub also accessible from host browser at \`http://<vm-ip>:3777/\`).
          EOF
          else
            TITLE="OmniOS Lite Live ISO (${TAG})"
            cat > /tmp/release-notes.md <<EOF
          ## OmniOS Potato-PC Lite Live ISO (\`x86_64\` Hybrid BIOS + UEFI)
          - **\`${ISO_FILE}\`** (~${SIZE_MB} MB) — SHA-256: \`${SHA}\`
          EOF
          fi

          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" \
              "dist/${ISO_FILE}" \
              "dist/${ISO_FILE}.sha256" \
              --clobber
            gh release edit "${TAG}" --title "${TITLE}" --notes-file /tmp/release-notes.md
          else
            gh release create "${TAG}" \
              --target "${GITHUB_SHA}" \
              --title "${TITLE}" \
              --notes-file /tmp/release-notes.md \
              "dist/${ISO_FILE}" \
              "dist/${ISO_FILE}.sha256"
          fi
