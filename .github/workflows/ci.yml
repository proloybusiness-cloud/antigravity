name: CI — Validate Workflows & Test Gen-1

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Validate all workflow DAG blueprints
        run: npm run validate

      - name: Run full Gen-1 end-to-end test suite
        run: npm test
